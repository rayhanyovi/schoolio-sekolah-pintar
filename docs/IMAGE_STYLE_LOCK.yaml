IMAGE_STYLE_LOCK:
  name: "Schoolio Modular Paper System"
  purpose: "Premium SaaS landing page illustrations for a modern school operations platform"
  product_context:
    product_name: "Schoolio"
    product_type: "modern school operations platform"
    positioning:
      - "professional SaaS"
      - "warm institutional"
      - "organized school administration"
      - "not generic edtech"
      - "not children's app"
      - "not classroom stock art"

  global_visual_style:
    medium: "flat editorial vector illustration"
    camera_angle: "top-down bird's-eye desk view"
    composition_type: "organized layered document-card arrangement"
    mood:
      - "warm"
      - "calm"
      - "professional"
      - "institutional"
      - "trustworthy"
      - "premium SaaS"
    detail_level: "medium detail, clean and readable"
    perspective:
      required: "top-down flat view"
      forbidden:
        - "isometric"
        - "3D"
        - "frontal classroom scene"
        - "photographic perspective"

  canvas:
    aspect_ratio: "1:1 square"
    background:
      color: "#f8f4ea"
      description: "warm off-white cream linen paper background"
      texture: "subtle linen grain, visible but not noisy"
    spacing:
      - "generous breathing room"
      - "centered visual mass"
      - "not crowded"
      - "landing-page friendly"

  objects:
    primary_object:
      type: "large cream document card"
      placement: "center foreground"
      surface: "cream paper"
      corners: "slightly rounded"
      shadow: "soft warm tan shadow"
      content: "clean UI/data rows related to school operations"
    secondary_objects:
      type: "smaller supporting document cards"
      placement: "layered behind or around primary card"
      rotation: "subtle 1-3 degree rotation only"
      shadow: "soft warm tan shadow"
      purpose: "show supporting school workflow data"
    optional_figure:
      style: "minimal geometric human figure"
      anatomy: "circle head, rectangular body, no face, no detailed limbs"
      role: "school admin/operator"
      placement: "beside or near the primary card"
      must_not_look_like: "cartoon character"

  color_palette:
    background_cream: "#f8f4ea"
    card_cream: "#fffaf0"
    ink_dark_green: "#102f2b"
    deep_forest_green: "#0f3b32"
    operational_green: "#3f8f73"
    teal: "#2f8f88"
    soft_sage: "#9fbea5"
    warm_gold: "#d6a546"
    warm_tan_shadow: "#d8c7a4"
    forbidden_colors:
      - "purple"
      - "blue SaaS gradient"
      - "neon"
      - "cool gray shadows"
      - "pure white background"

  typography_inside_image:
    style: "clean sans-serif"
    weight: "medium"
    readability: "simple, short labels only"
    forbidden:
      - "handwriting fonts"
      - "chalk fonts"
      - "comic fonts"
      - "decorative fonts"

  rendering_rules:
    must_have:
      - "flat graphic shapes"
      - "cream document cards"
      - "colored header bars"
      - "subtle linen texture"
      - "warm tan soft shadows"
      - "organized composition"
      - "professional SaaS feel"
    must_avoid:
      - "photorealistic rendering"
      - "3D effects"
      - "isometric view"
      - "cartoon characters"
      - "children illustrations"
      - "stock education clipart"
      - "messy scrapbook aesthetic"
      - "craft collage style"
      - "glossy surfaces"
      - "gradients"
      - "glows"
      - "neon effects"
      - "chalkboard aesthetic"
      - "classroom photography"
      - "whiteboard lecture scene"

  consistency_rules:
    - "Every image must look like part of the same illustration family."
    - "Always use the same background color, paper texture, card styling, shadow warmth, and visual density."
    - "Only change the document contents and small accent color based on the workflow stage."
    - "Do not change the camera angle."
    - "Do not introduce new visual metaphors outside paper cards, school records, simple dashboards, and minimal admin figures."
